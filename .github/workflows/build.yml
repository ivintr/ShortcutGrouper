name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake, VS2022, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = "build/bin/Release/GroupManager.exe"
          $dll = "build/bin/Release/ShellExtension.dll"
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          if (!(Test-Path $dll)) { throw "Missing $dll" }
          Get-Item $exe, $dll | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutGrouper-bin
          path: |
            build/bin/Release/GroupManager.exe
            build/bin/Release/ShellExtension.dll
